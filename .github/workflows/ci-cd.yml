name: CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and package
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Maven reactor
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Collect service JARs
        if: github.event_name == 'push'
        run: |
          mkdir -p dist
          cp account-service/target/account-service-1.0.0.jar dist/account-service.jar
          cp driver-vehicle-service/target/driver-vehicle-service-1.0.0.jar dist/driver-vehicle-service.jar
          cp ride-management-service/target/ride-management-service-1.0.0.jar dist/ride-management-service.jar
          cp fare-payment-service/target/fare-payment-service-1.0.0.jar dist/fare-payment-service.jar

      - name: Upload service JARs
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.service }} image
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - account-service
          - driver-vehicle-service
          - ride-management-service
          - fare-payment-service
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download service JARs
        uses: actions/download-artifact@v4
        with:
          name: service-jars
          path: dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ridelink-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: JAR_FILE=dist/${{ matrix.service }}.jar
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
