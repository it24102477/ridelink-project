name: RideLink CI

# Builds and runs the unit tests for the microservices on every push and
# pull request against main (brief section 6.4: "Configure a CI pipeline that
# automatically builds and runs tests for all four services on the agreed
# repository events"). A single `mvn verify` at the aggregator POM root covers
# every module; the matrix additionally reports each service as its own check
# so a failure is attributable to a specific service/owner at a glance.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - account-service
          - driver-vehicle-service
          - ride-management-service

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install the parent/aggregator POM
        run: mvn -B -N install

      - name: Build and test ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: mvn -B verify

      - name: Publish test results (${{ matrix.service }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports/**
          if-no-files-found: ignore

  integrated-build:
    name: Aggregator build (all services)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test every module from the aggregator POM
        run: mvn -B verify
